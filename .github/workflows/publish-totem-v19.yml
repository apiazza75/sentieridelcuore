name: Pubblica totem v19
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-totem-v19.yml']
permissions:
  contents: write
concurrency:
  group: publish-totem-v19
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Acquisisci e verifica il modello autorizzato
        env:
          MODEL_URL: 'https://sdmntprnortheu.oaiusercontent.com/files/00000000-edb4-81f4-a28f-674a1236df9e/raw?se=2026-10-23T01%3A51%3A48Z&sp=r&sv=2026-02-06&sr=b&scid=337f8b81-0813-550f-8318-ecb87e06c395&skoid=34268b52-5349-4f34-9be4-e38a5fb9f231&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-22T07%3A29%3A27Z&ske=2026-10-23T07%3A29%3A27Z&sks=b&skv=2026-02-06&sig=DTFSe1EuHPowVPgLPERrQg9rizP5GWo9WfIfCnDF4Tg%3D'
        run: |
          python - <<'PY'
          import os, urllib.request, hashlib, subprocess
          from pathlib import Path
          target = 'assets/totem-3d.html'
          old = subprocess.check_output(['git', 'rev-parse', 'HEAD:' + target], text=True).strip()
          if old != '7a3570ef74970350fb6e47a124d2d05a881a7da8':
              raise SystemExit('Il modello remoto è cambiato: nessuna sovrascrittura eseguita.')
          url = os.environ['MODEL_URL']
          print('::add-mask::' + url)
          with urllib.request.urlopen(url, timeout=90) as response:
              data = response.read(25000000)
          expected = '68e9de8e239ce95f350b89577d5a060087c16f98fcaa4203483c0050d2bc9c87'
          if hashlib.sha256(data).hexdigest() != expected:
              raise SystemExit('Checksum modello errato: pubblicazione interrotta.')
          text = data.decode('utf-8')
          assert 'Pannelli v18' in text and 'LED v19' in text and 'scenePacked' in text
          Path(target).write_bytes(data)
          print('Modello v19 verificato:', len(data), 'byte; SHA-256', expected)
          PY
      - name: Aggiorna esclusivamente il visualizzatore esistente
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- assets/totem-3d.html
          git diff --cached --quiet && exit 0
          git commit -m 'Totem v19: pannelli vettoriali v18 e LED bianchi su entrambi i lati'
          git push origin HEAD:main
