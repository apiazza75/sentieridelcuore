name: Compatibilita iframe totem v19
on:
  push:
    branches: [main]
    paths: ['.github/workflows/totem-v19-embed.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Supporta embed sia in query sia in hash
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess, hashlib
          p=Path('assets/totem-3d.html')
          assert subprocess.check_output(['git','rev-parse','HEAD:assets/totem-3d.html'],text=True).strip()=='2ac7b89504bc8326b076eae63f823f04abcdab73'
          s=p.read_text()
          old="if(new URLSearchParams(location.search).get('embed')==='1')document.body.classList.add('embed');"
          new="const queryParams=new URLSearchParams(location.search);const hashParams=new URLSearchParams(location.hash.replace(/^#/,''));if(queryParams.get('embed')==='1'||hashParams.get('embed')==='1')document.body.classList.add('embed');"
          assert s.count(old)==1
          p.write_text(s.replace(old,new))
          assert hashlib.sha256(p.read_bytes()).hexdigest()=='9d37f6e2db3689b7bd6f82f7e65efbd638819f58c3db9dce7388b7121a6ea0b8'
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- assets/totem-3d.html
          git commit -m 'Totem v19: compatibilità iframe embed esistente senza cambiare la pagina'
          git push origin HEAD:main
