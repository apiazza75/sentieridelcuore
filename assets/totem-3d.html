<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Totem DAE BNI Valtellina: modello 3D ruotabile v20 con rovere naturale e LED rosso rubino."><title>Totem DAE · BNI Valtellina · Rovere e LED rosso v20</title><style>html,body{height:100%;margin:0;background:#f4f7f5;color:#29312d;font:15px system-ui,sans-serif}main{height:100%;display:grid;place-content:center;text-align:center;padding:0 24px}h1{font-size:21px}p{line-height:1.6;color:#66736d}button{font:inherit;padding:10px 16px;border:1px solid #bac6bf;border-radius:6px;background:white;cursor:pointer}</style></head><body><main><h1>Totem BNI Valtellina</h1><p id="loading" role="status">Caricamento del modello in rovere naturale con LED rosso rubino…</p><noscript>Attiva JavaScript per utilizzare il modello 3D ruotabile.</noscript></main><script src="./totem-materials-v20.js?v=20"></script><script>
(async function(){
'use strict';
try{
 if(typeof window.applyTotemV20!=='function')throw new Error('Aggiornamento materiali non disponibile.');
 const response=await fetch(new URL('./totem-base-v19.html',location.href),{credentials:'same-origin'});
 if(!response.ok)throw new Error('Caricamento geometria non riuscito: '+response.status);
 const original=await response.text();
 const updated=window.applyTotemV20(original);
 document.open();document.write(updated);document.close();
}catch(error){
 console.error(error);
 const status=document.getElementById('loading');
 if(status){status.textContent='Non è stato possibile caricare il modello. '+error.message;const button=document.createElement('button');button.textContent='Riprova';button.onclick=()=>location.reload();status.after(button);}
}
})();
</script></body></html>
